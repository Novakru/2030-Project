  Irradiate: {required: [vessel, time], properties: [vessel, time, wavelength, color, temp, stir, stir_speed, LED_power, LED_intensity, cooling_power]}
  RunColumn: {required: [from_vessel, to_vessel, column], properties: [from_vessel, to_vessel, column]}
  Dissolve: {required: [vessel, solvent], properties: [vessel, solvent, volume, amount, temp, time, stir_speed]}
  WashSolid: {required: [vessel, solvent, volume], properties: [vessel, solvent, volume, filtrate_vessel, temp, stir, stir_speed, time, repeats]}
