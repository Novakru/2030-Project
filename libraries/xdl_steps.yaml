  HeatChillToTemp: {required: [vessel, temp], properties: [vessel, temp, active, continue_heatchill, stir, stir_speed, purpose]}
  StartHeatChill: {required: [vessel, temp], properties: [vessel, temp, purpose]}
  StopHeatChill: {required: [vessel], properties: [vessel]}
  Wait: {required: [time], properties: [time]}
  Purge: {required: [vessel], properties: [vessel, gas, time, pressure, flow_rate]}
