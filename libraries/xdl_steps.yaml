schema: mosaic.xdl-step-catalog/1
source: https://croningroup.gitlab.io/chemputer/xdl/standard/full_steps_specification.html
scope: XML syntax and declared properties only; platform execution is not certified.
steps:
  Add: {required: [vessel, reagent], properties: [vessel, reagent, volume, mass, amount, dropwise, time, stir, stir_speed, viscous, purpose]}
