instantiation:
  dmso:
    source: avantor_dmso
    parent_temp_C: 30
    bad_temperatures_C: [-20, -15, -10, -5, 0, 2, 4, 6, 8, 10, 12, 14]
    assumptions: ["The bottle contains neat DMSO; no solvent-mixture freezing point is inferred.", "30 C is a constructed point inside the manufacturer's permitted thawing region, not a reported experiment.", "The requested endpoint is bulk liquid at thermal equilibrium; transient supercooling is not excluded.", "Bottle contents are preloaded; volume and heating duration are unspecified."]
  flammables:
    source: nus_heating_web
    parent_temp_C: 30
    solvents: [methanol, ethanol, tetrahydrofuran, toluene, acetonitrile, ethyl_acetate]
    ignition_sources: [bunsen_burner, hot_air_gun]
    assumptions: ["Constructed open container of the named neat solvent in air at 30 C, with vapor exposure at the liquid surface.", "The positive scenario excludes ignition sources; one mutation introduces a source at the exposed vapor interface.", "30 C and solvent choices instantiate the general university instruction; they are not copied experimental conditions.", "Volume and heating duration are unspecified. Ignition risk does not assert that a fire occurred."]
