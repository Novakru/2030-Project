substitution_rules:
  - id: equipment.same_subtype
    relation: same_subtype
    note: Identity is only candidate retrieval; every supplied functional demand is still checked.
  - id: equipment.batch_container_alternative
    relation: conditional
    subtypes: [equipment.vial, equipment.flask, equipment.round_bottom_flask, equipment.batch_reactor]
    required_demands: [capacity_scope, wetted_materials]
    any_demands: [capacity_mL, working_volume_mL]
    note: Scoped to explicit supplied demands, never universal equivalence. Microreactors and plates are excluded.
