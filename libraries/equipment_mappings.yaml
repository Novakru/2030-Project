schema: mosaic.equipment-mappings/1
policy: Exact normalized aliases select identity only. They never add ratings, capabilities, operation mode, topology or a substitution approval.
normalization: Unicode NFKC, case folding, and removal of whitespace, underscores and hyphens; no fuzzy similarity.
