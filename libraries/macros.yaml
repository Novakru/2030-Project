version: 1
policy: "Expand only operations explicitly stated in source; missing amounts, order, phases, duration and setpoints must remain unresolved."
decomposition_status: "Proposed decompositions, not certified lossless rewrites. Target pH, endpoints, repeated cycles and apparatus requirements must survive before any macro is admitted."
macros:
  Reflux: {expansion: [HeatChill], requires: [solvent, reflux_apparatus], context: {reflux: true}}
  Quench: {expansion: [Add], requires: [quench_reagent, amount], context: {purpose: quench}}
  Extract: {expansion: [Add, Separate], requires: [solvent, amount, keep_phase]}
  Wash: {expansion: [Add, Separate], requires: [wash_reagent, amount, keep_phase]}
  DrySolution: {expansion: [Add, Filter], requires: [drying_agent, amount], context: {purpose: drying}}
  Recrystallize: {expansion: [Add, HeatChill, Filter], requires: [solvent, amount, temperatures]}
  Dissolve: {expansion: [Add, Stir], requires: [solvent, amount, duration_s]}
  AdjustPH: {expansion: [Add], requires: [reagent, amount, target_pH]}
  Concentrate: {expansion: [Evaporate], requires: []}
  Triturate: {expansion: [Add, Stir, Filter], requires: [solvent, amount, duration_s]}
  Precipitate: {expansion: [Add, HeatChill], requires: [reagent, amount, temp_C]}
