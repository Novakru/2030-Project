compatibility:
- id: hf_unspecified_glass
  chemical: hydrofluoric_acid
  material: glass_unspecified
  source_url: https://www.cdc.gov/niosh/npg/npgd0334.html
  scope: "Source explicitly reports glass, but not its subtype; NIOSH states HF attacks glass. No borosilicate grade inferred."
- id: hf_glass
  chemical: hydrofluoric_acid
