version: 2
scope: "Internal analysis IR. xdl_steps are export mappings, not synonyms for physical execution."
minimality: "Candidate basis, not a proven universal minimum. Merge only with lossless parameter/state representation and preserved risk checks; zero selected-corpus use alone is not removal evidence."
source_urls:
  - https://croningroup.gitlab.io/chemputer/xdl/standard/full_steps_specification.html
  - https://github.com/rxn4chemistry/paragraph2actions/blob/37d9642348540952c83eaa88cf40fdea39b15382/src/paragraph2actions/actions.py
operations:
  Add: {required: [vessel, reagent, amount], optional: [rate, temp_C], risks: [A1, A4, B4, B5, C3, C4], xdl_steps: [Add], reason: "Introduces a quantified material into vessel state."}
  Transfer: {required: [from_vessel, to_vessel, amount], optional: [rate], risks: [A1, A5], xdl_steps: [Transfer], reason: "Changes material location and connectivity requirements."}
  HeatChill: {required: [vessel, temp_C], optional: [duration_s, ramp], risks: [A2, B1, B2, B3, C2], xdl_steps: [HeatChill, HeatChillToTemp], reason: "Carries the temperature constraint."}
  Stir: {required: [vessel, duration_s], optional: [rpm], risks: [A1, A3], xdl_steps: [Stir], reason: "Carries stirring rate."}
  Wait: {required: [duration_s], optional: [], risks: [C6], xdl_steps: [Wait], reason: "Carries elapsed time without implying another operation."}
  Atmosphere: {required: [vessel, gas, mode], optional: [duration_s], risks: [C5], xdl_steps: [Purge, EvacuateAndRefill], context_only_modes: [environment, balloon], reason: "Carries gas identity and actual establishment method; environment remains metadata."}
  Separate: {required: [vessel, keep_phase], optional: [to_vessel, solvent], risks: [A5, D1, D2], xdl_steps: [Separate], reason: "Selects which phase contains product."}
  Filter: {required: [vessel, keep], optional: [to_vessel, through], risks: [A5, D1], xdl_steps: [Filter, FilterThrough], reason: "Selects solid versus filtrate."}
  Evaporate: {required: [vessel], optional: [pressure_mbar, temp_C, duration_s], risks: [A2, B1, D1], xdl_steps: [Evaporate], reason: "Removes volatile inventory; unspecified vacuum/temperature stays unknown."}
  Irradiate: {required: [vessel, duration_s], optional: [wavelength_nm, power_W, color], risks: [A2], xdl_steps: [Irradiate], reason: "Carries optical wavelength and power."}
  Sonicate: {required: [duration_s], optional: [power_W], risks: [], xdl_steps: [], reason: "Ultrasound-specific energy; no verified standard export, quarantine on export."}
  Purify: {required: [vessel, method], optional: [to_vessel], risks: [D1], xdl_steps: [RunColumn], reason: "Opaque terminal purification; chromatography only has a verified export mapping."}
