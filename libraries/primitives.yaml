version: 2
scope: "Internal extraction representation. xdl_steps are export mappings, not synonyms for physical execution."
minimality: "Candidate basis, not a proven universal minimum. Merge only with lossless parameter/state representation and preserved source parameters; zero selected-corpus use alone is not removal evidence."
source_urls:
  - https://croningroup.gitlab.io/chemputer/xdl/standard/full_steps_specification.html
  - https://github.com/rxn4chemistry/paragraph2actions/blob/37d9642348540952c83eaa88cf40fdea39b15382/src/paragraph2actions/actions.py
operations:
  Add: {required: [vessel, reagent, amount], optional: [rate, temp_C], xdl_steps: [Add], reason: "Introduces a quantified material into vessel state."}
  Transfer: {required: [from_vessel, to_vessel, amount], optional: [rate], xdl_steps: [Transfer], reason: "Changes material location and connectivity requirements."}
  HeatChill: {required: [vessel, temp_C], optional: [duration_s, ramp], xdl_steps: [HeatChill, HeatChillToTemp], reason: "Carries the temperature constraint."}
  Stir: {required: [vessel, duration_s], optional: [rpm], xdl_steps: [Stir], reason: "Carries stirring rate."}
  Wait: {required: [duration_s], optional: [], xdl_steps: [Wait], reason: "Carries elapsed time without implying another operation."}
  Atmosphere: {required: [vessel, gas, mode], optional: [duration_s], xdl_steps: [Purge, EvacuateAndRefill], context_only_modes: [environment, balloon], reason: "Carries gas identity and actual establishment method; environment remains metadata."}
  Separate: {required: [vessel, keep_phase], optional: [to_vessel, solvent], xdl_steps: [Separate], reason: "Selects which phase contains product."}
  Filter: {required: [vessel, keep], optional: [to_vessel, through], xdl_steps: [Filter, FilterThrough], reason: "Selects solid versus filtrate."}
  Evaporate: {required: [vessel], optional: [pressure_mbar, temp_C, duration_s], xdl_steps: [Evaporate], reason: "Removes volatile inventory; unspecified vacuum/temperature stays unknown."}
  Irradiate: {required: [vessel, duration_s], optional: [wavelength_nm, power_W, color], xdl_steps: [Irradiate], reason: "Carries optical wavelength and power."}
  Sonicate: {required: [duration_s], optional: [power_W], xdl_steps: [], reason: "Ultrasound-specific energy; no verified standard export, quarantine on export."}
  Purify: {required: [vessel, method], optional: [to_vessel], xdl_steps: [RunColumn], reason: "Opaque terminal purification; chromatography only has a verified export mapping."}
