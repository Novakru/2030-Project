[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-risk"
version = "0.1.0"
description = "Traceable chemical procedure extraction and single-fault benchmark construction"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7", "lxml>=5,<7", "pyarrow>=15,<26", "ord-schema>=0.3.80,<1", "protobuf>=4,<7", "jsonpatch>=1.33,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
ml = ["scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "rdkit>=2023.9"]

[project.scripts]
protocol-risk = "protocol_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
