[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-xdl"
version = "0.3.0"
description = "Source-grounded multi-agent conversion of experimental procedure text to XDL"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7", "lxml>=5,<7", "jsonpatch>=1.33,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
review = ["streamlit>=1.40,<2", "pandas>=2,<3"]

[project.scripts]
mosaic = "mosaic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
