stages:
  - "lint"
  - "test"
  - "deploy"

.test:
  before_script:
    - python -V
    - pip -V
    - python -m venv venv
    - . venv/bin/activate
    - pip install -U setuptools
    - pip install -U wheel
    - pip install pytest
    - pip install coverage
    # Needed for opencv to work
    - apt-get update
    - apt-get install ffmpeg libsm6 libxext6  -y

    # Required for AnalyticalLabware Advion
    - wget https://packages.microsoft.com/config/debian/10/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
    - dpkg -i packages-microsoft-prod.deb
    - apt-get update
    - apt-get install -y apt-transport-https
    - apt-get install -y dotnet-sdk-5.0
    - apt-get install -y aspnetcore-runtime-5.0
    - apt-get install -y dotnet-runtime-5.0
    - apt-get install -y clang
    - apt-get install -y libglib2.0-dev

    - git clone https://github.com/pythonnet/pythonnet
    - cd pythonnet
    - pip install -r requirements.txt
    - python setup.py build_dotnet
    - python setup.py bdist_wheel
    - cd ..

    - apt install apt-transport-https dirmngr gnupg ca-certificates
    - apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
    - echo "deb https://download.mono-project.com/repo/debian stable-stretch main" | tee /etc/apt/sources.list.d/mono-official-stable.list
    - apt update
    - apt install mono-devel nuget -y
    - mono --version

    # Install xdl requirements
    # Install Chempiler, SerialLabware and ChemputerAPI for simulations

    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/chempiler.git@master

    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/seriallabware.git@SerialLabware2

    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/chemputerapi.git@master
    - pip install git+https://github.com/croningp/commanduino.git@master
    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/commanduinolabware.git@master
    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/xdl.git@master
    - pip install git+https://$CG_USER:$CG_PW@gitlab.com/croningroup/chemputer/analyticallabware.git@master#egg=AnalyticalLabware[all]

    # Install chemputerxdl
    - pip install .
    - pip freeze

  script:
    - coverage run --source=chemputerxdl -m pytest tests -m "unit or integration" -x -rf
    - coverage report -m

test-python:3.7:
  extends: ".test"
  stage: "test"
  image: "python:3.7"

test-python:3.8:
  extends: ".test"
  stage: "test"
  image: "python:3.8.9"

test-python:3.9:
  extends: ".test"
  stage: "test"
  image: "python:3.9.4"

lint:
  stage: "lint"
  image: "python:3.8"

  variables:
    FLAKE8_PER_FILE_IGNORE: tests/*:T001,T003,scripts/*:T001

  script:
    - pip install flake8
    - pip install flake8-print
    - flake8 . --per-file-ignores=$FLAKE8_PER_FILE_IGNORE

pages:
  stage: "deploy"
  image: "python:3.8"
  script:
    - pip install git+https://$CHEMPILER_USER:$CHEMPILER_PW@gitlab.com/croningroup/chemputer/chempiler.git@master
    - pip install networkx==2.2
    - pip install -U sphinx
    - pip install sphinx_rtd_theme
    - cd documentation
    - ./makedocs.sh
    - sphinx-build -b html -c ./ . ../public
  artifacts:
    paths:
      - public
  only:
    - master
