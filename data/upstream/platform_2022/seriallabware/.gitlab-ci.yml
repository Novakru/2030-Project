cache:
  paths:
    - .cache/pip

image: python:3.6

before_script:
  - python -V
  - pip install wheel --quiet
  - pip install .
  - pip freeze

stages:
  - Lint
  - Test
  - Publish

flake8:
  stage: Lint
  script:
    - pip install flake8 --quiet
    - flake8 SerialLabware

test:
  stage: Test
  script:
    - pip install pytest --quiet
    - pytest tests/

pages:
  stage: Publish
  script:
    - pip install Sphinx
    - pip install sphinx-rtd-theme
    - pip install sphinx-autodoc-typehints
    - mkdir public
    - cd docs && make html
    - mv ./html/html/* ../public
  artifacts:
    paths:
      - public


